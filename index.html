<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="styles/styles.css">
    
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyCalculator</title>
</head>
<body>
    <div class="calculator">
        <div class = "display"></div>
         <div class = "buttons">
          <div class ="row">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>/</button>
        </div>
          <div class="row">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>*</button>
            </div>
            <div class="row">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>-</button>
        </div>
        <div class="row"> 
            
            <button>0</button>
            <button>.</button>
            <button>Backspace</button>
            <button>+</button>
            
        </div>
        <div class="row">
            <button>=</button>
            <button>Clear</button>
        </div>
    </div>
        
        <script src="script/script.js"></script>
</body>
</html>
